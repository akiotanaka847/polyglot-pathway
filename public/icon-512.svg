<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.8)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Globe circle -->
  <circle cx="256" cy="240" r="130" fill="none" stroke="url(#globe)" stroke-width="8" opacity="0.9"/>
  <!-- Globe lines -->
  <ellipse cx="256" cy="240" rx="130" ry="50" fill="none" stroke="white" stroke-width="4" opacity="0.4"/>
  <ellipse cx="256" cy="240" rx="50" ry="130" fill="none" stroke="white" stroke-width="4" opacity="0.4"/>
  <line x1="126" y1="240" x2="386" y2="240" stroke="white" stroke-width="4" opacity="0.3"/>
  <line x1="256" y1="110" x2="256" y2="370" stroke="white" stroke-width="4" opacity="0.3"/>
  <!-- Language characters floating around -->
  <text x="160" y="160" font-family="Georgia,serif" font-size="36" fill="white" opacity="0.9" text-anchor="middle">あ</text>
  <text x="356" y="170" font-family="Georgia,serif" font-size="32" fill="white" opacity="0.85" text-anchor="middle">Ñ</text>
  <text x="380" y="310" font-family="Georgia,serif" font-size="34" fill="white" opacity="0.8" text-anchor="middle">字</text>
  <text x="140" y="330" font-family="Georgia,serif" font-size="30" fill="white" opacity="0.85" text-anchor="middle">ع</text>
  <text x="256" y="140" font-family="Georgia,serif" font-size="28" fill="white" opacity="0.7" text-anchor="middle">Б</text>
  <!-- App name -->
  <text x="256" y="445" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" fill="white" font-weight="700" text-anchor="middle" letter-spacing="4">LINGORA</text>
</svg>